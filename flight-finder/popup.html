<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 14px; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  button { width: 100%; margin-top: 14px; padding: 10px; font-size: 15px; background: #1a73e8; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #status { font-size: 12px; color: #777; margin-top: 8px; min-height: 14px; }
  .code { direction: ltr; text-transform: uppercase; }
</style>
</head>
<body>
<h1>✈️ חפש טיסות זולות יותר</h1>
<div class="row">
  <div><label>מוצא (קוד)</label><input id="from" class="code" maxlength="3" placeholder="TLV"></div>
  <div><label>יעד (קוד)</label><input id="to" class="code" maxlength="3" placeholder="LON"></div>
</div>
<div class="row">
  <div><label>הלוך</label><input id="dep" type="date"></div>
  <div><label>חזור</label><input id="ret" type="date"></div>
</div>
<label>נוסעים</label><input id="adults" type="number" min="1" max="9" value="1">
<button id="go">חפש באתרים אחרים</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
